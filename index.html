<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fourward Belt Co. ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== BRAND TOKENS ===== */
:root{
  --brown:#5A351C; --black:#171717; --ivory:#F7F2E8; --white:#FFFFFF;
  --line:#E4DCCB; --muted:#6F6458; --brown-soft:#EFE5D8;
  --ok:#5E6B2F; --ok-bg:#ECEFD9; --warn:#9A6A12; --warn-bg:#F6EBCF; --bad:#9B3B26; --bad-bg:#F5DFD8;
  --serif:'Libre Baskerville',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);font-size:14px;color:var(--black);background:var(--ivory)}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
/* Sidebar */
aside{background:var(--white);border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;border-bottom:1px solid var(--line);margin-bottom:12px}
.brand img{width:40px;height:auto}
.brand b{font-family:var(--serif);font-size:16px;color:var(--brown);display:block;line-height:1.1}
.brand span{font-size:12px;color:var(--muted)}
.navgroup{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 10px 6px}
nav a{display:block;padding:8px 10px;border-radius:6px;color:var(--black);text-decoration:none;margin-bottom:2px}
nav a:hover{background:var(--brown-soft)}
nav a.active{background:var(--brown);color:var(--ivory)}
/* Main */
main{padding:28px 32px;max-width:1200px;width:100%}
h1{font-family:var(--serif);font-weight:700;font-size:24px;margin:0 0 4px;color:var(--brown)}
h2{font-family:var(--serif);font-size:16px;margin:0 0 12px}
.sub{color:var(--muted);margin-bottom:22px}
.card{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g2{grid-template-columns:1fr 1fr}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:static;height:auto}.g2{grid-template-columns:1fr}}
.kpi .label{font-size:12px;color:var(--muted)}
.kpi .val{font-family:var(--serif);font-size:22px;margin-top:4px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);padding:8px 6px}
td{padding:8px 6px;border-bottom:1px solid #F1EBDF}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow:auto;max-height:520px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--white);width:100%}
input:focus,select:focus{outline:2px solid var(--brown);outline-offset:-1px}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.row>div{flex:1;min-width:120px}
button{font:inherit;padding:8px 14px;border-radius:6px;border:1px solid var(--brown);background:var(--brown);color:var(--ivory);cursor:pointer}
button.ghost{background:transparent;color:var(--brown)}
button.sm{padding:4px 10px;font-size:12px}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
.msg{padding:10px 12px;border-radius:6px;margin-bottom:12px}
.msg.ok{background:var(--ok-bg);color:var(--ok)}.msg.bad{background:var(--bad-bg);color:var(--bad)}
.todo{border:1px dashed var(--brown);background:var(--brown-soft);color:var(--brown);border-radius:10px;padding:16px}
.todo ul{margin:8px 0 0;padding-left:18px}
.totals td{border:none;padding:4px 6px}
.totals tr.grand td{font-weight:600;font-size:16px;border-top:1px solid var(--line);padding-top:8px}
.muted{color:var(--muted)}
/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login .box{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:32px;width:100%;max-width:400px}
.login img{width:64px;display:block;margin:0 auto 10px}
.login h1{text-align:center}
.login .field{margin-bottom:12px}
.tabs{display:flex;background:var(--brown-soft);border-radius:8px;padding:4px;margin:0 0 18px}
.tabs a{flex:1;text-align:center;padding:8px;border-radius:6px;text-decoration:none;color:var(--brown);font-weight:500}
.tabs a.on{background:var(--white);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.modal{position:fixed;inset:0;background:rgba(23,23,23,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal[hidden]{display:none}
.mbox{background:var(--white);border-radius:12px;padding:20px;width:100%;max-width:440px}
#reader{width:100%;min-height:60px;border-radius:8px;overflow:hidden;background:#000;margin-bottom:12px}
.scanwrap{display:flex;gap:6px}.scanwrap input{flex:1}
.cambtn{padding:6px 10px;display:flex;align-items:center}
.badge{display:inline-block;min-width:18px;padding:0 6px;margin-left:6px;border-radius:99px;background:var(--warn-bg);color:var(--warn);font-size:11px;font-weight:600;text-align:center}
nav a.active .badge{background:var(--ivory);color:var(--brown)}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}

.customizer-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);gap:16px;align-items:start}
.shop-image{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:var(--ivory)}
.custom-card{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.option-label{font-size:12px;color:var(--muted);margin:14px 0 7px;font-weight:600}
.choice-row{display:flex;gap:8px;flex-wrap:wrap}
.choice{background:var(--white);color:var(--black);border:1px solid var(--line);border-radius:7px;padding:9px 12px;min-height:40px}
.choice.selected{background:var(--brown);border-color:var(--brown);color:var(--ivory)}
.swatch-choice{display:flex;align-items:center;gap:8px}
.swatch-dot{width:17px;height:17px;border-radius:50%;border:1px solid rgba(0,0,0,.2);display:inline-block;flex:none}
.selection-summary{border-top:1px solid var(--line);margin-top:14px;padding-top:12px;display:flex;justify-content:space-between;gap:10px;align-items:start}
.selection-summary strong{font-family:var(--serif);font-size:15px;color:var(--brown)}
.bom-list{margin:8px 0 0;padding:0;list-style:none}
.bom-list li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #F1EBDF;font-size:12px}
.bom-list li:last-child{border-bottom:0}
.ai-note{font-size:11px;color:var(--muted);margin-top:5px;text-align:right}
@media(max-width:900px){.customizer-grid{grid-template-columns:1fr}}
.prod{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.prod .nm{font-family:var(--serif);font-size:14px;color:var(--brown)}
.prod .pr{font-size:16px;font-weight:600}
.prod .row{margin-top:auto}
.pill.info{background:var(--brown-soft);color:var(--brown)}
.demo{font-size:12px;color:var(--muted);margin-top:18px;border-top:1px solid var(--line);padding-top:12px;line-height:1.6}
.userbox{overflow-wrap:anywhere;margin-top:18px;border-top:1px solid var(--line);padding:12px 10px 0;font-size:13px}
/* Barcode labels */
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.label{border:1px solid var(--line);border-radius:6px;padding:8px;text-align:center;background:#fff;break-inside:avoid}
.label .nm{font-size:11px;margin:2px 0}
svg.bc{max-width:100%;height:auto}
@media print{aside,.noprint,.todo,.msg{display:none!important}.app{display:block}main{padding:0}body{background:#fff}.labels{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

<script>
/* =====================================================================
   FOURWARD BELT CO. ERP — BARE-BONES SHELL
   ---------------------------------------------------------------------
   HOW IT'S ORGANIZED
   1. MODULES   – the sidebar list. Add a module = add one line here
                  + one render function in VIEWS. r = which roles see it.
   AUTH       – login, sign-up, roles (admin / staff / customer).
   2. SEED      – starting data. Each array matches a future Supabase
                  table (locations, items, boms, inventory, suppliers,
                  customers, sales, purchase_orders, production_orders,
                  adjustments). Swap seed() for Supabase queries later.
   3. HELPERS   – money formatting, lookups, inventory math.
   4. VIEWS     – one function per page. Returns HTML.
   Costs and prices below are SAMPLE numbers. Replace with the team's.
   ===================================================================== */

/* ---------- 1. MODULES ---------- */
const STAFF=['admin','staff'], ADMIN=['admin'], CUST=['customer'];
const MODULES = [
  {group:'Overview',   id:'dashboard',  name:'Dashboard',      r:STAFF},
  {group:'Sell',       id:'pos',        name:'Point of Sale',  r:STAFF},
  {group:'Sell',       id:'pickups',    name:'Pickup Orders',  r:STAFF},
  {group:'Sell',       id:'sales',      name:'Sales History',  r:STAFF},
  {group:'Sell',       id:'returns',    name:'Returns',        r:STAFF},
  {group:'Sell',       id:'customers',  name:'Customers',      r:STAFF},
  {group:'Make & Buy', id:'inventory',  name:'Inventory',      r:STAFF},
  {group:'Make & Buy', id:'production', name:'Production',     r:STAFF},
  {group:'Make & Buy', id:'purchasing', name:'Purchasing',     r:STAFF},
  {group:'Make & Buy', id:'suppliers',  name:'Suppliers',      r:STAFF},
  {group:'Make & Buy', id:'mrp',        name:'MRP',            r:STAFF},
  {group:'Money',      id:'financials', name:'Financials',     r:STAFF},
  {group:'Settings',   id:'items',      name:'Items & BOMs',   r:STAFF},
  {group:'Settings',   id:'labels',     name:'Barcode Labels', r:STAFF},
  {group:'Settings',   id:'users',      name:'Users',          r:ADMIN},
  {group:'Settings',   id:'about',      name:'About',          r:STAFF},
  {group:'My Account', id:'shop',       name:'Shop',           r:CUST},
  {group:'My Account', id:'portal',     name:'My Orders',      r:CUST},
  {group:'My Account', id:'account',    name:'Account',        r:CUST},
];

/* ---------- 2. SEED DATA ---------- */
function seed(){
  const locations = [
    {id:'HOU', name:'Houston, TX',        type:'Warehouse + Assembly', tax:0},
    {id:'LOU', name:'Louisville, KY',     type:'Store', tax:0.06},
    {id:'OKC', name:'Oklahoma City, OK',  type:'Store', tax:0.08625},
  ];
  // Sam's supplier list
  const suppliers = [
    {id:'S1', name:'Summit Leather Co.',   supplies:'Leather straps',        contact:'Maria Chen',  phone:'801-555-0101', email:'maria.chen@gmail.com',  lead:14, terms:'Net 30'},
    {id:'S2', name:'Canyon Canvas Supply', supplies:'Canvas straps',         contact:'Luis Ortega', phone:'801-555-0102', email:'luis.ortega@gmail.com', lead:10, terms:'Net 30'},
    {id:'S3', name:'Apex Metalworks',      supplies:'Silver & gold buckles', contact:'Dana Brooks', phone:'801-555-0103', email:'dana.brooks@gmail.com', lead:21, terms:'Net 45'},
    {id:'S4', name:'Ironclad Hardware',    supplies:'Black & dog buckles',   contact:'Eric Vaughn', phone:'801-555-0104', email:'eric.vaughn@gmail.com', lead:28, terms:'Net 60'},
    {id:'S5', name:'Lone Star Thread Co.', supplies:'Thread',                contact:'Priya Shah',  phone:'801-555-0105', email:'priya.shah@gmail.com',  lead:7,  terms:'Net 15'},
    {id:'S6', name:'Gulf Coast Plastics',  supplies:'Ratchet tracks',        contact:'Marcus Reed', phone:'801-555-0106', email:'marcus.reed@gmail.com', lead:12, terms:'Net 30'},
  ];
  const items = [];
  const comp = (sku,name,cost,sup,unit='ea') => items.push({sku,name,type:'Component',unit,cost,price:0,reorder:50,supplier:sup});
  // Leather straps (4)
  comp('LS-MW-BLK',"Men's Wide Leather Strap, Black",8,'S1');
  comp('LS-MW-BRN',"Men's Wide Leather Strap, Brown",8,'S1');
  comp('LS-WN-BLK',"Women's Narrow Leather Strap, Black",7,'S1');
  comp('LS-WN-BRN',"Women's Narrow Leather Strap, Brown",7,'S1');
  // Canvas straps (7) + thread (6)
  const colors = {BLK:'Black',BRN:'Brown',WHT:'White',TAN:'Tan',GRY:'Grey',NVY:'Navy'};
  Object.entries({...colors,CMO:'Camo'}).forEach(([c,n])=>comp('CS-'+c,'Canvas Strap, '+n,3,'S2'));
  Object.entries(colors).forEach(([c,n])=>comp('TH-'+c,'Thread, '+n,0.10,'S5','yd'));
  // Track + buckles (8)
  comp('RT-PLS','Plastic Ratchet Track',1.5,'S6');
  comp('BK-SLV-W','Silver Buckle, Wide',4,'S3');  comp('BK-SLV-N','Silver Buckle, Narrow',4,'S3');
  comp('BK-GLD-W','Gold Buckle, Wide',5,'S3');    comp('BK-GLD-N','Gold Buckle, Narrow',5,'S3');
  comp('BK-BLK-W','Black Belt Buckle, Wide',3,'S4');
  comp('BK-DOG-BLK','Black Dog Buckle',2,'S4');   comp('BK-DOG-BRN','Brown Dog Buckle',2,'S4');

  // Finished goods (18) + single-level BOMs
  const boms = {};
  const fin = (sku,name,price,parts) => { items.push({sku,name,type:'Finished',unit:'ea',cost:null,price,reorder:10}); boms[sku]=parts; };
  const belt = (strap,thread,buckle) => [{sku:strap,qty:1},{sku:thread,qty:5},{sku:'RT-PLS',qty:1},{sku:buckle,qty:1}];
  fin('FB-WL-BLK',"Women's Black Leather Belt",45,belt('LS-WN-BLK','TH-BLK','BK-SLV-N'));
  fin('FB-WL-BRN',"Women's Brown Leather Belt",45,belt('LS-WN-BRN','TH-BRN','BK-GLD-N'));
  fin('FB-ML-BLK',"Men's Black Leather Belt",50,belt('LS-MW-BLK','TH-BLK','BK-SLV-W'));
  fin('FB-ML-BRN',"Men's Brown Leather Belt",50,belt('LS-MW-BRN','TH-BRN','BK-GLD-W'));
  Object.entries(colors).forEach(([c,n])=>{
    fin('FB-CV-'+c+'-S',`Canvas Belt, ${n} / Silver`,25,belt('CS-'+c,'TH-'+c,'BK-SLV-W'));
    fin('FB-CV-'+c+'-B',`Canvas Belt, ${n} / Black`,25,belt('CS-'+c,'TH-'+c,'BK-BLK-W'));
  });
  fin('FD-COL-BLK','Dog Collar, Black',18,[{sku:'CS-CMO',qty:1},{sku:'BK-DOG-BLK',qty:1},{sku:'TH-BLK',qty:5}]);
  fin('FD-COL-BRN','Dog Collar, Brown',18,[{sku:'CS-CMO',qty:1},{sku:'BK-DOG-BRN',qty:1},{sku:'TH-BRN',qty:5}]);

  // Starting inventory: components in Houston, finished goods everywhere
  const inventory = {};
  items.forEach(it=>{
    inventory[it.sku] = it.type==='Component'
      ? {HOU: it.unit==='yd'?2000:200, LOU:0, OKC:0}
      : {HOU:20, LOU:15, OKC:15};
  });
  // Sam's customer list (C1 = walk-in for anonymous store sales)
  const customers = [
    {id:'C1',  name:'Walk-in Customer',     type:'Individual', email:'',                            pickup:'',    typical:'Store sales with no account'},
    {id:'C2',  name:'Emily Carter',         type:'Individual', email:'emily.carter@gmail.com',      pickup:'LOU', typical:"Men's black leather belt"},
    {id:'C3',  name:'Noah Bennett',         type:'Individual', email:'noah.bennett@gmail.com',      pickup:'OKC', typical:"Men's brown leather belt"},
    {id:'C4',  name:'Sofia Ramirez',        type:'Individual', email:'sofia.ramirez@gmail.com',     pickup:'LOU', typical:"Women's black leather belt"},
    {id:'C5',  name:'Ethan Brooks',         type:'Individual', email:'ethan.brooks@gmail.com',      pickup:'OKC', typical:'Black canvas belt'},
    {id:'C6',  name:'Olivia Kim',           type:'Individual', email:'olivia.kim@gmail.com',        pickup:'LOU', typical:'Black or brown dog collar'},
    {id:'C7',  name:'Mason Wright',         type:'Individual', email:'mason.wright@gmail.com',      pickup:'OKC', typical:"Men's black leather belt"},
    {id:'C8',  name:'Ava Patel',            type:'Individual', email:'ava.patel@gmail.com',         pickup:'LOU', typical:'Navy canvas belt, occasional purchase'},
    {id:'C9',  name:'Lone Oak Uniforms',    type:'Business',   email:'lone.oak.uniforms@gmail.com', pickup:'OKC', typical:"20–30 men's black and brown leather belts every two months; larger orders before the school year"},
    {id:'C10', name:'Red River Outfitters', type:'Business',   email:'red.river.outfitters@gmail.com', pickup:'LOU', typical:'10–15 canvas belts monthly, mostly black and brown; occasional other colors'},
    {id:'C11', name:'Paws & Trails Supply', type:'Business',   email:'paws.trails.supply@gmail.com',   pickup:'OKC', typical:'15–25 dog collars every month or two, split between black and brown'},
  ];
  return {locations,suppliers,items,boms,inventory,customers,
          sales:[],returns:[],orders:[],transfers:[],purchase_orders:[],production_orders:[],adjustments:[],seq:1000};
}

/* Load saved state (this browser only) or start fresh */
const KEY='fourward-erp-v2';
let db; try{ db = JSON.parse(localStorage.getItem(KEY)) || seed(); }catch(e){ db = seed(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} }
async function resetData(){ db = seed(); await initUsers(); save(); Auth.signOut(); }

/* ---------- AUTH ----------
   Passwords are salted + hashed (SHA-256), never stored as plain text.
   Wrong password 5 times = account locked for 1 minute.
   Customers only ever see their own orders (in Supabase, enforce this
   with Row Level Security too).
   SUPABASE SWAP: replace the insides of Auth.signIn / signUp / signOut with
     supabase.auth.signInWithPassword({email,password})
     supabase.auth.signUp({email,password})
     supabase.auth.signOut()
   and keep role + customer_id in a "profiles" table. */
const DEMO_USERS = [
  {email:'admin@fourward.example', name:'Admin',       role:'admin', pw:'Admin123!'},
  {email:'staff@fourward.example', name:'Store Staff', role:'staff', pw:'Staff123!'},
  // Customer portal logins from Sam's list
  {email:'emily.carter@gmail.com',         name:'Emily Carter',         role:'customer', customer:'C2',  pw:'Carter321'},
  {email:'noah.bennett@gmail.com',         name:'Noah Bennett',         role:'customer', customer:'C3',  pw:'NB1992'},
  {email:'sofia.ramirez@gmail.com',        name:'Sofia Ramirez',        role:'customer', customer:'C4',  pw:'GoCougs$!'},
  {email:'ethan.brooks@gmail.com',         name:'Ethan Brooks',         role:'customer', customer:'C5',  pw:'BrooksE3'},
  {email:'olivia.kim@gmail.com',           name:'Olivia Kim',           role:'customer', customer:'C6',  pw:'OKim254'},
  {email:'mason.wright@gmail.com',         name:'Mason Wright',         role:'customer', customer:'C7',  pw:'MWright23!'},
  {email:'ava.patel@gmail.com',            name:'Ava Patel',            role:'customer', customer:'C8',  pw:'AvaP@Kentucky'},
  {email:'lone.oak.uniforms@gmail.com',    name:'Lone Oak Uniforms',    role:'customer', customer:'C9',  pw:'Loakunis360'},
  {email:'red.river.outfitters@gmail.com', name:'Red River Outfitters', role:'customer', customer:'C10', pw:'Routfitters5'},
  {email:'paws.trails.supply@gmail.com',   name:'Paws & Trails Supply', role:'customer', customer:'C11', pw:'Paws&Trails4Life'},
];
async function sha256(t){ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
const newSalt=()=>[...crypto.getRandomValues(new Uint8Array(16))].map(x=>x.toString(16).padStart(2,'0')).join('');
async function makeUser(u){ const salt=newSalt(); return {email:u.email.toLowerCase(),name:u.name,role:u.role,customer:u.customer||null,salt,hash:await sha256(salt+u.pw),failed:0,lockedUntil:0}; }
async function initUsers(){ db.users=[]; for(const u of DEMO_USERS) db.users.push(await makeUser(u)); }
const SESSION_KEY='fourward-erp-session';
let session=null;
const Auth = {
  async signIn(email,pw,portal){
    const u=db.users.find(x=>x.email===email.trim().toLowerCase());
    if(u && u.lockedUntil>Date.now()) throw new Error('Too many failed attempts. Try again in a minute.');
    if(!u || await sha256(u.salt+pw)!==u.hash){
      if(u){ u.failed++; if(u.failed>=5){ u.lockedUntil=Date.now()+60000; u.failed=0; } save(); }
      throw new Error('Wrong email or password.');
    }
    // Each sign-in page only accepts its own kind of account
    if(portal==='staff' && u.role==='customer') throw new Error('This is a customer account. Use the Customer Portal tab.');
    if(portal==='customer' && u.role!=='customer') throw new Error('This is a staff account. Use the Staff tab.');
    u.failed=0; save(); session={email:u.email};
    try{ sessionStorage.setItem(SESSION_KEY,u.email); }catch(e){}
    return u;
  },
  async signUp(name,email,pw){
    name=name.trim(); email=email.trim().toLowerCase();
    if(!name) throw new Error('Enter your name or business name.');
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) throw new Error('Enter a valid email.');
    if(pw.length<8) throw new Error('Password must be at least 8 characters.');
    if(db.users.some(u=>u.email===email)) throw new Error('That email already has an account.');
    const cid=nextId('C'); db.customers.push({id:cid,name,type:'Individual',email});
    db.users.push(await makeUser({email,name,role:'customer',customer:cid,pw})); save();
    return this.signIn(email,pw,'customer');
  },
  async changePassword(cur,next){
    const u=this.user();
    if(await sha256(u.salt+cur)!==u.hash) throw new Error('Current password is wrong.');
    if(next.length<8) throw new Error('New password must be at least 8 characters.');
    u.salt=newSalt(); u.hash=await sha256(u.salt+next); save();
  },
  signOut(){ const u=this.user(); if(u) loginTab=u.role==='customer'?'customer':'staff'; session=null; try{ sessionStorage.removeItem(SESSION_KEY); }catch(e){} history.replaceState(null,'',location.pathname+location.search); render(); },
  user(){ return session && db.users?.find(u=>u.email===session.email); },
};

let authMode='login', authMsg='', loginTab='staff';
function loginView(){
  const cust=loginTab==='customer', su=cust && authMode==='signup';
  const demos=DEMO_USERS.filter(u=>cust? u.role==='customer' : u.role!=='customer');
  const tab=(id,label)=>`<a href="#" class="${loginTab===id?'on':''}" onclick="event.preventDefault();loginTab='${id}';authMode='login';authMsg='';render()">${label}</a>`;
  return `<div class="login"><form class="box" onsubmit="event.preventDefault();doAuth(this)">
    <img src="${$('.brand img').src}" alt="Fourward Belt Co. logo"><h1>Fourward Belt Co.</h1>
    <div class="sub" style="text-align:center">${cust? (su?'Create your customer account':'View your orders and receipts') : 'Sign in to the ERP'}</div>
    <div class="tabs">${tab('staff','Staff')}${tab('customer','Customer Portal')}</div>
    ${authMsg?`<div class="msg bad">${esc(authMsg)}</div>`:''}
    ${su?`<div class="field"><label>Name or business</label><input name="fullname" autocomplete="name" required></div>`:''}
    <div class="field"><label>Email</label><input name="email" type="email" autocomplete="username" required></div>
    <div class="field"><label>Password</label><input name="pw" type="password" autocomplete="${su?'new-password':'current-password'}" required></div>
    <button style="width:100%">${su?'Create account':'Sign in'}</button>
    ${cust? `<div style="text-align:center;margin-top:12px"><a href="#" style="color:var(--brown)" onclick="event.preventDefault();authMode='${su?'login':'signup'}';authMsg='';render()">${su?'Have an account? Sign in':'New customer? Create an account'}</a></div>`
          : `<div class="muted" style="text-align:center;margin-top:12px;font-size:12px">Staff accounts are created by an admin.</div>`}
    <div class="demo"><b>Demo logins</b><br>${demos.slice(0,3).map(u=>`${esc(u.email)} / ${esc(u.pw)}`).join('<br>')}${demos.length>3?`<br>+ ${demos.length-3} more customers (see Users page)`:''}</div>
  </form></div>`;
}
async function doAuth(f){
  const v=n=>f.elements[n]?.value||'';
  try{ authMsg=''; (loginTab==='customer' && authMode==='signup')? await Auth.signUp(v('fullname'),v('email'),v('pw')) : await Auth.signIn(v('email'),v('pw'),loginTab);
       authMode='login'; history.replaceState(null,'',location.pathname+location.search); render(); }
  catch(e){ authMsg=e.message; render(); }
}

/* ---------- 3. HELPERS ---------- */

const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$'+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const round2 = n => Math.round(n*100)/100;
const item = sku => db.items.find(i=>i.sku===sku);
const loc  = id  => db.locations.find(l=>l.id===id);
const sup  = id  => db.suppliers.find(s=>s.id===id);
const nextId = p => p + (++db.seq);
const today = () => new Date().toISOString().slice(0,10);
/* Unit cost: components use stored cost; finished goods roll up from their BOM */
function unitCost(sku){
  const it = item(sku); if(!it) return 0;
  if(it.type==='Component') return it.cost;
  return round2((db.boms[sku]||[]).reduce((s,p)=>s+unitCost(p.sku)*p.qty,0));
}
const onHand = (sku,locId) => db.inventory[sku]?.[locId] ?? 0;
const totalOnHand = sku => db.locations.reduce((s,l)=>s+onHand(sku,l.id),0);
function moveStock(sku,locId,delta){ db.inventory[sku][locId] = onHand(sku,locId) + delta; }
const opts = (arr,val,lab,sel) => arr.map(a=>`<option value="${esc(a[val])}" ${a[val]===sel?'selected':''}>${esc(lab(a))}</option>`).join('');
const todo = (title,list) => `<div class="todo"><b>To build: ${esc(title)}</b><ul>${list.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
let flash = null;
/* Barcodes: any <svg class="bc" data-code="SKU"> is drawn as Code 128 after each render */
function drawBarcodes(){ document.querySelectorAll('svg.bc').forEach(el=>{ try{ JsBarcode(el,el.dataset.code,{format:'CODE128',height:+(el.dataset.h||50),width:1.6,fontSize:13,margin:4,lineColor:'#171717',background:'#ffffff'}); }catch(e){} }); }
/* Camera scanning (phone or laptop camera). Needs a web address (GitHub Pages)
   or the HTML file opened in Chrome. The claude.ai preview blocks the camera. */
const CAM_ICON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
const camBtn = handler => `<button type="button" class="ghost cambtn" title="Scan with camera" aria-label="Scan with camera" onclick="openScanner(c=>${handler})">${CAM_ICON}</button>`;
let cam=null, camCb=null;
async function openScanner(cb){
  camCb=cb; $('#scanModal').hidden=false; $('#scanErr').hidden=true;
  try{
    const L=window.__Html5QrcodeLibrary__;
    cam=new L.Html5Qrcode('reader',{formatsToSupport:[L.Html5QrcodeSupportedFormats.CODE_128],verbose:false});
    await cam.start({facingMode:'environment'},{fps:10,qrbox:{width:280,height:110}},
      code=>{ const f=camCb; closeScanner(); if(f) f(code); }, ()=>{});
  }catch(e){
    cam=null; $('#scanErr').hidden=false;
    $('#scanErr').textContent='Camera not available here. Open the app from its web address (e.g. GitHub Pages) or the HTML file in Chrome, and allow camera access. A USB scanner works everywhere.';
  }
}
async function closeScanner(){ $('#scanModal').hidden=true; const c=cam; cam=null; if(c){ try{ await c.stop(); c.clear(); }catch(e){} } }
/* Scan into a dropdown: USB scanners type the code + Enter, like a keyboard */
const scanBox = sel => `<div><label>Scan</label><div class="scanwrap"><input placeholder="Scan barcode" onkeydown="if(event.key==='Enter'){scanSelect('${sel}',this.value);this.value=''}">${camBtn(`scanSelect('${sel}',c)`)}</div></div>`;
function scanSelect(sel,v){ v=v.trim().toUpperCase(); const el=$(sel);
  if([...el.options].some(o=>o.value===v)){ el.value=v; flash=null; } else { flash={bad:true,text:'SKU "'+v+'" not found here.'}; render(); } } // one-time message shown at the top of the next render

/* ---------- Shared bits ---------- */
function kpi(label,val){ return `<div class="card kpi"><div class="label">${esc(label)}</div><div class="val">${esc(val)}</div></div>`; }
/* table(headers, rows): a cell can be text, {n:value} for right-aligned numbers, or {h:html} */
function table(head,rows){
  const cell=(c,t)=> c&&typeof c==='object' ? (c.h!==undefined? `<${t}>${c.h}</${t}>` : `<${t} class="n">${esc(c.n)}</${t}>`) : `<${t}>${esc(c)}</${t}>`;
  return `<table><tr>${head.map(h=>cell(h,'th')).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>cell(c,'td')).join('')}</tr>`).join('')}</table>`;
}
function salesTable(list){
  return list.length? table(['Receipt','Date','Store','Customer',{n:'Items'},{n:'Total'}],
    list.map(s=>[s.id,s.date,loc(s.store).name,db.customers.find(c=>c.id===s.customer)?.name||'',{n:s.lines.reduce((a,l)=>a+l.qty,0)},{n:money(s.total)}]))
    : '<span class="muted">No sales yet.</span>';
}
/* Money totals, net of returns. Returned items reverse revenue + COGS;
   damaged returns become a write-off (a loss). */
function totals(list=db.sales, rets=db.returns||[]){
  const gross=list.reduce((a,x)=>a+x.subtotal-x.discount,0), refunds=rets.reduce((a,r)=>a+r.refundSub,0);
  const cogs=list.reduce((a,x)=>a+x.cogs,0)-rets.reduce((a,r)=>a+r.cogs,0);
  const writeOff=rets.reduce((a,r)=>a+r.writeOff,0);
  const tax=list.reduce((a,x)=>a+x.tax,0)-rets.reduce((a,r)=>a+r.tax,0);
  return {gross,refunds,rev:gross-refunds,cogs,writeOff,tax,profit:gross-refunds-cogs-writeOff};
}
const invValue = () => db.items.reduce((s,i)=>s+totalOnHand(i.sku)*unitCost(i.sku),0);

/* ---------- POS actions ---------- */
let posCart = {store:'LOU',customer:'C1',lines:[],discType:'pct',discVal:0};
let lastReceipt = null;
function posAdd(sku){
  sku=(sku||'').trim().toUpperCase(); const it=item(sku);
  if(!it||it.type!=='Finished'){ flash={bad:true,text:'No sellable item with SKU "'+sku+'".'}; render(); return; }
  const line=posCart.lines.find(l=>l.sku===sku);
  line? line.qty++ : posCart.lines.push({sku,qty:1,price:it.price});
  lastReceipt=null; render(); $('#scan')?.focus();
}
function posClear(){ posCart={...posCart,lines:[],discVal:0}; lastReceipt=null; render(); }
/* One place that records a sale: used by POS and by pickup orders.
   Takes stock out of the store, records revenue, tax and COGS. */
function makeSale({store,customer,lines,discType='pct',discVal=0,source='POS',orderId=null}){
  const st=loc(store);
  const subtotal=round2(lines.reduce((a,l)=>a+l.price*l.qty,0));
  const discount=round2(discType==='pct'? subtotal*(discVal/100) : Math.min(discVal,subtotal));
  const tax=round2((subtotal-discount)*st.tax);
  const cogs=round2(lines.reduce((a,l)=>a+unitCost(l.sku)*l.qty,0));
  const sale={id:nextId('R-'),date:today(),store,customer,lines:lines.map(l=>({sku:l.sku,qty:l.qty,price:l.price})),
    subtotal,discType,discVal,discount,taxRate:st.tax,tax,total:round2(subtotal-discount+tax),cogs,source,orderId};
  sale.lines.forEach(l=>moveStock(l.sku,store,-l.qty)); // can go negative = backorder
  db.sales.push(sale); save();
  return sale;
}
function posCheckout(){
  const c=posCart;
  const sale=makeSale({store:c.store,customer:c.customer,lines:c.lines,discType:c.discType,discVal:c.discVal});
  lastReceipt=sale; posCart={...c,lines:[],discVal:0};
  flash={text:'Sale '+sale.id+' recorded.'}; render();
}
function receiptHTML(s){
  return `<div style="margin-top:18px;border-top:1px dashed var(--line);padding-top:14px;font-size:13px">
   <b style="font-family:var(--serif);color:var(--brown)">Fourward Belt Co.</b><br><span class="muted">${esc(loc(s.store).name)} · ${s.date} · ${s.id}</span>

/* ---------- Inventory / production / purchasing actions ---------- */
let invFilter={q:'',type:'All'};
function invSearch(v){ invFilter.q=v; render(); const el=$('#invQ'); el.focus(); el.setSelectionRange(v.length,v.length); }
function adjust(){
  const sku=$('#adjSku').value, l=$('#adjLoc').value, q=+$('#adjQty').value||0, why=$('#adjWhy').value;
  if(!q){ flash={bad:true,text:'Enter a quantity to adjust.'}; return render(); }
  moveStock(sku,l,q); db.adjustments.push({id:nextId('A-'),date:today(),sku,loc:l,qty:q,reason:why}); save();
  flash={text:`Adjusted ${sku} at ${l} by ${q} (${why}).`}; render();
}
function produce(){
  const sku=$('#moSku').value, q=Math.max(1,+$('#moQty').value||1), parts=db.boms[sku];
  const short=parts.filter(p=>onHand(p.sku,'HOU')<p.qty*q);
  if(short.length){ flash={bad:true,text:'Not enough in Houston: '+short.map(p=>p.sku).join(', ')}; return render(); }
  parts.forEach(p=>moveStock(p.sku,'HOU',-p.qty*q)); moveStock(sku,'HOU',q);
  db.production_orders.push({id:nextId('MO-'),date:today(),sku,qty:q,unitCost:unitCost(sku)}); save();
  flash={text:`Built ${q} × ${item(sku).name} in Houston.`}; render();
}
function createPO(){
  const sku=$('#poSku').value, q=Math.max(1,+$('#poQty').value||1), it=item(sku), s=sup(it.supplier);
  const exp=new Date(Date.now()+s.lead*864e5).toISOString().slice(0,10);
  db.purchase_orders.push({id:nextId('PO-'),date:today(),supplier:s.id,sku,qty:q,unitCost:it.cost,expected:exp,status:'Open'}); save();
  flash={text:`PO created with ${s.name}, expected ${exp}.`}; render();
}
function receivePO(id){
  const p=db.purchase_orders.find(x=>x.id===id); moveStock(p.sku,'HOU',p.qty); p.status='Received'; p.received=today(); save();
  flash={text:`Received ${p.qty} × ${item(p.sku).name} into Houston.`}; render();
}

function shopSelection(){
  let sku, detail, buckleLabel;
  if(shopConfig.kind==='collar'){
    sku='FD-COL-'+shopConfig.collar;
    detail='Camo canvas · '+(shopConfig.collar==='BLK'?'black':'brown')+' buckle and thread';
    buckleLabel=shopConfig.collar==='BLK'?'Black':'Brown';
  }else if(shopConfig.collection==='canvas'){
    sku='FB-CV-'+shopConfig.color+'-'+shopConfig.canvasBuckle;
    const color={BLK:'Black',BRN:'Brown',WHT:'White',TAN:'Tan',GRY:'Grey',NVY:'Navy blue'}[shopConfig.color];
    detail='Unisex canvas · '+color+' strap · '+(shopConfig.canvasBuckle==='S'?'silver':'black')+' buckle';
    buckleLabel=shopConfig.canvasBuckle==='S'?'Silver':'Black';
  }else{
    const color=shopConfig.color==='BLK'?'BLK':'BRN';
    sku='FB-'+(shopConfig.gender==='men'?'ML':'WL')+'-'+color;
    detail=(shopConfig.gender==='men'?'Men’s wide':'Women’s narrow')+' leather · '+(color==='BLK'?'black':'brown')+' strap';
    buckleLabel=color==='BLK'?'Silver':'Gold';
  }
  return {sku,detail,buckleLabel};
}
function shopSet(key,value){shopConfig[key]=value;render();}
let cart={store:null,lines:[]}, pickFilter='Open';
const openOrders=()=>(db.orders||[]).filter(o=>['Placed','Ready'].includes(o.status));
/* Available = on hand minus what open orders at that store already claim */
const reserved=(sku,store)=>openOrders().filter(o=>o.store===store).reduce((a,o)=>a+o.lines.filter(l=>l.sku===sku).reduce((b,l)=>b+l.qty,0),0);
const available=(sku,store)=>Math.max(0,onHand(sku,store)-reserved(sku,store));
function shortages(o){ return o.lines.map(l=>({sku:l.sku,need:l.qty-onHand(l.sku,o.store)})).filter(x=>x.need>0); }
function statusPill(st){ const c={Placed:'info',Ready:'warn','Picked up':'ok',Cancelled:'bad'}[st]||'info'; return `<span class="pill ${c}">${esc(st)}</span>`; }
function cartAdd(sku,q){
  q=Math.floor(q||0); if(q<1){ flash={bad:true,text:'Enter a quantity of 1 or more.'}; return render(); }
  const l=cart.lines.find(x=>x.sku===sku); l? l.qty+=q : cart.lines.push({sku,qty:q});
  flash={text:`Added ${q}× ${item(sku).name}.`}; render();
}
function placeOrder(){
  const u=Auth.user(), st=loc(cart.store);
  const lines=cart.lines.map(l=>({sku:l.sku,qty:l.qty,price:item(l.sku).price}));
  const subtotal=round2(lines.reduce((a,l)=>a+l.price*l.qty,0)), tax=round2(subtotal*st.tax);
  const o={id:nextId('PU-'),date:today(),customer:u.customer,store:cart.store,lines,subtotal,taxRate:st.tax,tax,total:round2(subtotal+tax),status:'Placed',saleId:null};
  db.orders.push(o); save(); cart.lines=[];
  flash={text:`Order ${o.id} placed for pickup at ${st.name}. We'll mark it ready soon.`}; if(location.hash!=='#portal') location.hash='portal'; else render();
}
function setOrder(id,status){
  const o=db.orders.find(x=>x.id===id);
  if(status==='Ready'){ const sh=shortages(o); if(sh.length){ flash={bad:true,text:'Not enough stock at the store yet.'}; return render(); } }
  o.status=status; save(); flash={text:`${o.id} marked ${status.toLowerCase()}.`}; render();
}
function transferFor(id){
  const o=db.orders.find(x=>x.id===id), sh=shortages(o);
  const noHOU=sh.find(x=>onHand(x.sku,'HOU')<x.need);
  if(noHOU){ flash={bad:true,text:`Houston only has ${onHand(noHOU.sku,'HOU')} of ${noHOU.sku}. Build more in Production first.`}; return render(); }
  sh.forEach(x=>{ moveStock(x.sku,'HOU',-x.need); moveStock(x.sku,o.store,x.need);
    db.transfers.push({id:nextId('T-'),date:today(),sku:x.sku,from:'HOU',to:o.store,qty:x.need,ref:o.id}); });
  save(); flash={text:`Transferred ${sh.map(x=>x.need+'× '+x.sku).join(', ')} from Houston to ${loc(o.store).name}.`}; render();
}
function pickUp(id){
  const o=db.orders.find(x=>x.id===id);
  const sale=makeSale({store:o.store,customer:o.customer,lines:o.lines,source:'Pickup',orderId:o.id});
  o.status='Picked up'; o.saleId=sale.id; save();
  flash={text:`${o.id} picked up. Sale ${sale.id} recorded (${money(sale.total)}).`}; render();
}

/* ---------- Returns actions ---------- */
let retSale=null;
const returnedQty=(saleId,sku)=>(db.returns||[]).filter(r=>r.saleId===saleId).reduce((a,r)=>a+r.lines.filter(l=>l.sku===sku).reduce((b,l)=>b+l.qty,0),0);
function loadReturn(v){
  v=(v||'').trim().toUpperCase(); const x=db.sales.find(s=>s.id===v);
  if(!x){ flash={bad:true,text:'No receipt "'+v+'" found.'}; retSale=null; } else retSale=x.id;
  if(location.hash!=='#returns'){ location.hash='returns'; } else render();
}
function processReturn(){
  const x=db.sales.find(v=>v.id===retSale), ratio=x.subtotal? x.discount/x.subtotal : 0;
  const lines=x.lines.map((l,i)=>({sku:l.sku,qty:Math.floor(+$('#rq'+i).value||0),restock:$('#rc'+i).value==='restock',
    unit:l.price*(1-ratio),left:l.qty-returnedQty(x.id,l.sku)})).filter(l=>l.qty>0);
  if(!lines.length){ flash={bad:true,text:'Enter a return quantity on at least one line.'}; return render(); }
  const over=lines.find(l=>l.qty>l.left);
  if(over){ flash={bad:true,text:`Only ${over.left} of ${item(over.sku).name} can still be returned.`}; return render(); }
  const refundSub=round2(lines.reduce((a,l)=>a+l.unit*l.qty,0)), tax=round2(refundSub*x.taxRate);
  const cogs=round2(lines.reduce((a,l)=>a+unitCost(l.sku)*l.qty,0));
  const writeOff=round2(lines.filter(l=>!l.restock).reduce((a,l)=>a+unitCost(l.sku)*l.qty,0));
  const id=nextId('RT-');
  lines.forEach(l=>{ if(l.restock) moveStock(l.sku,x.store,l.qty);
    else db.adjustments.push({id:nextId('A-'),date:today(),sku:l.sku,loc:x.store,qty:0,reason:'Damaged return '+id}); });
  db.returns.push({id,date:today(),saleId:x.id,store:x.store,customer:x.customer,
    lines:lines.map(({sku,qty,restock})=>({sku,qty,restock})),refundSub,tax,total:round2(refundSub+tax),cogs,writeOff});
  save(); retSale=null; flash={text:`Return ${id} done. Refund ${money(refundSub+tax)} (incl. ${money(tax)} tax).`}; render();
}
function receiveScan(v){
  v=(v||'').trim().toUpperCase(); const p=db.purchase_orders.find(x=>x.status==='Open'&&x.sku===v);
  if(!p){ flash={bad:true,text:'No open purchase order for "'+v+'".'}; return render(); }
  receivePO(p.id);
}

/* ---------- Users / portal actions ---------- */
let labelType='Finished', viewReceipt=null;
async function addUser(f){
  const v=n=>f.elements[n].value.trim(), email=v('email').toLowerCase();
  if(db.users.some(u=>u.email===email)){ flash={bad:true,text:'That email already has an account.'}; return render(); }
  db.users.push(await makeUser({email,name:v('fullname'),role:v('role'),pw:f.elements.pw.value})); save();
  flash={text:`Added ${email} as ${v('role')}.`}; render();
}
async function changePw(f){
  try{ await Auth.changePassword(f.elements.cur.value,f.elements.next.value); flash={text:'Password updated.'}; }
  catch(e){ flash={bad:true,text:e.message}; }
  render();
}

/* ---------- Router + render ---------- */
const allowed = () => { const u=Auth.user(); return u? MODULES.filter(m=>m.r.includes(u.role)) : []; };
function current(){ const a=allowed(), h=location.hash.slice(1); return a.some(m=>m.id===h)? h : a[0].id; }
function render(){
  const u=Auth.user();
  $('#app').style.display = u? '' : 'none';
  $('#loginView').innerHTML = u? '' : loginView();
  if(!u) return;
  const cur=current(); let last='';
  $('#nav').innerHTML = allowed().map(m=>{const g=m.group!==last?`<div class="navgroup">${m.group}</div>`:''; last=m.group;
    const n=m.id==='pickups'?openOrders().length:0;
    return g+`<a href="#${m.id}" class="${m.id===cur?'active':''}">${m.name}${n?`<span class="badge">${n}</span>`:''}</a>`;}).join('');
  $('#userbox').innerHTML = `<b>${esc(u.name)}</b><br><span class="muted">${esc(u.email)} · ${esc(u.role)}</span><br><button class="ghost sm" style="margin-top:8px" onclick="Auth.signOut()">Sign out</button>`;
  const msg = flash? `<div class="msg ${flash.bad?'bad':'ok'}">${esc(flash.text)}</div>`:''; flash=null;
  $('#view').innerHTML = msg + VIEWS[cur]();
  drawBarcodes();
}
window.addEventListener('hashchange',()=>{lastReceipt=null;viewReceipt=null;render();});
(async()=>{
  if(!db.users){ await initUsers(); save(); }
  db.returns ||= []; db.orders ||= []; db.transfers ||= [];
  try{ const e=sessionStorage.getItem(SESSION_KEY); if(e && db.users.some(u=>u.email===e)) session={email:e}; }catch(e){}
  render();
})();
</script>
